services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    privileged: true
    volumes:
      - piston-data:/piston
    # Production: do NOT publish ports.
    # Local debug only — comment out in shared/staging/prod:
    ports:
      - "127.0.0.1:2000:2000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:2000/api/v2/runtimes"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Nest Dockerfile lands in a later task. Until then, run Nest on the host with
  # PISTON_URL=http://127.0.0.1:2000. This service is a stub for compose wiring.
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PISTON_URL: http://piston:2000
    depends_on:
      piston:
        condition: service_started
    restart: unless-stopped
    profiles:
      - full

volumes:
  piston-data:
